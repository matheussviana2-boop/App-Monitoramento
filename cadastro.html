<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro da Frota · Checagem de Câmeras · Monitoramento Univale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --teal:#00A19B; --teal-d:#00807B; --teal-50:#E6F6F5; --aqua:#10CFC9; --red:#EA0029; --red-50:#FDEBEE;
  --ink:#16302F; --ink-2:#4A5E5D; --ink-3:#7F908F; --line:#E1E8E7; --grid:#EDF1F0; --bg:#F3F6F6; --card:#FFFFFF;
  --r:14px; --shadow:0 1px 2px rgba(22,48,47,.06),0 4px 14px rgba(22,48,47,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.45;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.01em}
button,select,input{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:0;background:none}

.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.top img{height:30px;display:block}
.top .sep{width:1px;height:28px;background:var(--line)}
.top .ttl{display:flex;flex-direction:column;line-height:1.15}
.top .ttl span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.top .ttl b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:17px;font-weight:700}
.brand-bar{height:3px;background:linear-gradient(90deg,var(--teal),var(--aqua))}

.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h3{font-size:16px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap}

.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:44px 16px;text-align:center;color:var(--ink-2);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--teal);background:var(--teal-50)}
.drop b{display:block;margin-top:10px;font-size:15.5px}
.note{font-size:12.5px;color:var(--ink-3);margin-top:4px}

.file{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.file b{font-size:15px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--teal-50);color:var(--teal-d)}
.chip.err{background:var(--red-50);color:#B4001F}

.cols{display:grid;grid-template-columns:400px 1fr;gap:14px;align-items:start}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:#F7F9F9;position:sticky;top:0;z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tbl-wrap.max{max-height:480px}
.pref{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800}
.placa{font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--ink-2);border:1px solid #C9D3D2;border-top:3px solid #1F4FA0;border-radius:4px;padding:0 5px;line-height:1.5;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tag.novo{background:var(--teal-50);color:var(--teal-d)} .tag.atu{background:#EEF2F2;color:var(--ink-2)} .tag.err{background:var(--red-50);color:#B4001F}
.cam{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.cam button{width:30px;height:32px;font-size:17px;font-weight:700;color:var(--teal-d)}
.cam button:hover{background:var(--teal-50)}
.cam span{min-width:28px;text-align:center;font-weight:700;font-size:15px}
.pos{font-size:11.5px;color:var(--ink-3);display:block;margin-top:2px}

.bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.bar .resumo{flex:1;font-size:13px;color:var(--ink-2)}
.inp{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:200px}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,161,155,.15)}
.btn{padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;display:inline-flex;gap:7px;align-items:center;border:1.5px solid var(--line);background:#fff}
.btn:hover{border-color:var(--teal);color:var(--teal-d)}
.btn-p{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-p:hover{background:var(--teal-d);color:#fff}
.btn-p:disabled{background:#B9CFCD;border-color:#B9CFCD;cursor:not-allowed}
.alert{padding:12px 14px;border-radius:10px;font-size:13.5px}
.alert.ok{background:var(--teal-50);color:var(--teal-d)}
.alert.err{background:var(--red-50);color:#8a0019}

.loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;place-items:center;z-index:90}
.loading.show{display:grid}
.spin{width:38px;height:38px;border:4px solid var(--teal-50);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
@media(max-width:560px){.top .sep{display:none}.wrap{padding:14px 16px 32px}.top-in{padding:10px 16px}.inp{width:100%}.bar .btn{flex:1;justify-content:center}}
</style>
</head>

  prefixo:['VEICULO','PREFIXO','FROTA','NUMERODEFROTA','NFROTA','CARRO'],
  placa:  ['PLACA','PLACAS'],
  tipo:   ['TIPOEQUIP','TIPOEQUIPAMENTO','TIPOVEICULO','TIPODEVEICULO','TIPO','CATEGORIA'],
  cameras:['QTDCAMERAS','QTDECAMERAS','QUANTIDADEDECAMERAS','CAMERAS']
};

/** Tipo padronizado e câmeras sugeridas a partir do texto da planilha (editável na tela). */
function sugerir(tipoOrig, setor){
  const t = norm(tipoOrig);
  if (/HIACE|VAN|SPRINTER|MASTER|DUCATO|DAILY|BOXER/.test(t)) return { tipo:'VAN', cameras:2 };
  if (/HILUX|AUXILIAR|LEVE|PICKUP|PICAPE|S10|RANGER|AMAROK|L200|STRADA|TORO/.test(t)) return { tipo:'HILUX', cameras:2 };
  if (/MICR/.test(t)) return { tipo:'MICRO', cameras: /VALE/.test(norm(setor)) ? 3 : 4 };
  if (/ONIBUS|RODOV|URBANO|SEMI|INTERMUN|FRETAMENTO/.test(t)) return { tipo:'ÔNIBUS', cameras:4 };
  return { tipo: String(tipoOrig || '').trim().toUpperCase() || 'OUTRO', cameras:4 };
}

/* ---------- API ---------- */
let demoCad = [];
async function api(fn, args){
  if (!ONLINE){
    if (fn === 'getCadastro') return { cadastro: demoCad };
    if (fn === 'importarCadastro'){
      const idx = Object.fromEntries(demoCad.map((v, i) => [v.placa, i])); let novos = 0, atu = 0;
      args[0].forEach(r => { if (r.placa in idx){ demoCad[idx[r.placa]] = r; atu++; } else { idx[r.placa] = demoCad.push(r) - 1; novos++; } });
      return { novos, atualizados:atu, removidos:0, total:demoCad.length };
    }
  }
  const r = await fetch(API_URL.trim(), { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ fn, args }) });
  if (!r.ok) throw new Error('Servidor respondeu ' + r.status);
  const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'Erro no servidor');
  return j.dados;
}

/* ---------- estado ---------- */
const S = { arquivo:'', base:[], regras:{}, rows:[], erros:[], placasAtuais:new Set() };
const chaveRegra = (setor, tipoOrig) => setor + '||' + tipoOrig;

async function carregarPlacasAtuais(){
  try{ const r = await api('getCadastro', []); S.placasAtuais = new Set((r.cadastro || []).map(v => normPlaca(v.placa))); }
  catch(e){ S.placasAtuais = new Set(); }
}

/* ---------- leitura ---------- */
function lerArquivo(f){
  const rd = new FileReader();
  rd.onload = async e => {
    try{
      const wb = XLSX.read(e.target.result, { type:'array' });
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'', raw:false });
      if (!raw.length) throw new Error('A primeira aba da planilha está vazia.');
      const heads = Object.keys(raw[0]), col = {};
      for (const k in COLS){ for (const c of COLS[k]){ const h = heads.find(x => norm(x) === c); if (h){ col[k] = h; break; } } }
      const falta = ['setor','prefixo','placa','tipo'].filter(k => !col[k]);
      if (falta.length) throw new Error('Coluna não encontrada na planilha: ' + falta.map(k => ({ setor:'Tipo Serviço', prefixo:'Veículo', placa:'Placa', tipo:'Tipo Equip.' }[k])).join(', ') + '.');
      S.arquivo = f.name;
      S.base = raw.map((r, i) => ({ linha:i + 2, setor:String(r[col.setor]).trim().toUpperCase(), prefixo:String(r[col.prefixo]).trim(),
        placa:normPlaca(r[col.placa]), tipoOrig:String(r[col.tipo]).trim(), camPlanilha: col.cameras ? parseInt(r[col.cameras], 10) : NaN }))
        .filter(r => r.placa || r.prefixo);
      S.regras = {};
      S.base.forEach(r => { const k = chaveRegra(r.setor, r.tipoOrig); if (!S.regras[k]){ const s = sugerir(r.tipoOrig, r.setor); if (r.camPlanilha > 0) s.cameras = r.camPlanilha; S.regras[k] = { ...s, setor:r.setor, tipoOrig:r.tipoOrig }; } });
      loading(true); await carregarPlacasAtuais(); loading(false);
      $('#msg').innerHTML = '';
      $('#secArq').hidden = true; $('#secPrev').hidden = false;
      render();
    }catch(err){ $('#msg').innerHTML = `<div class="alert err">${esc(err.message || err)}</div>`; $('#file').value = ''; }
  };
  rd.readAsArrayBuffer(f);
}

/* ---------- prévia ---------- */
function render(){
  const vistos = new Set(); S.rows = []; S.erros = [];
  S.base.forEach(r => {
    const g = S.regras[chaveRegra(r.setor, r.tipoOrig)];
    const motivo = !r.placa ? 'sem placa' : !r.prefixo ? 'sem prefixo' : !r.setor ? 'sem tipo de serviço' : vistos.has(r.placa) ? 'placa repetida' : '';
    const l = { linha:r.linha, setor:r.setor, prefixo:r.prefixo, placa:r.placa, tipo:g.tipo, cameras:g.cameras, novo:!S.placasAtuais.has(r.placa), motivo };
    if (motivo) S.erros.push(l); else { vistos.add(r.placa); S.rows.push(l); }
  });
  const setores = [...new Set(S.rows.map(r => r.setor))].sort();
  $('#fileNome').textContent = S.arquivo;
  $('#chips').innerHTML = setores.map(s => `<span class="chip">${esc(s)} · ${S.rows.filter(r => r.setor === s).length}</span>`).join(' ') +
    (S.erros.length ? ` <span class="chip err">${S.erros.length} com erro</span>` : '');

  const multi = setores.length > 1;
  const regras = Object.entries(S.regras).sort((a, b) => a[1].setor.localeCompare(b[1].setor) || a[1].tipo.localeCompare(b[1].tipo));
  $('#tRegras').innerHTML = `<thead><tr>${multi ? '<th>Setor</th>' : ''}<th>Tipo</th><th class="n">Veíc.</th><th class="n">Câmeras</th></tr></thead><tbody>` +
    regras.map(([k, g]) => `<tr>${multi ? `<td>${esc(g.setor)}</td>` : ''}<td><b>${esc(g.tipo)}</b><span class="pos">${esc(g.tipoOrig)}</span></td>
      <td class="n">${S.base.filter(r => chaveRegra(r.setor, r.tipoOrig) === k).length}</td>
      <td class="n"><span class="cam" data-k="${esc(k)}"><button data-d="-1" aria-label="Menos uma câmera">−</button><span>${g.cameras}</span><button data-d="1" aria-label="Mais uma câmera">+</button></span></td></tr>`).join('') + '</tbody>';

  const lista = S.erros.concat(S.rows);
  $('#tPrev').innerHTML = `<thead><tr><th></th><th>Setor</th><th>Prefixo</th><th>Placa</th><th>Tipo</th><th class="n">Câm.</th></tr></thead><tbody>` +
    lista.map(r => `<tr><td>${r.motivo ? `<span class="tag err">${esc(r.motivo)}</span>` : r.novo ? '<span class="tag novo">Novo</span>' : '<span class="tag atu">Atualiza</span>'}</td>
      <td>${esc(r.setor) || '—'}</td><td><span class="pref">${esc(r.prefixo) || '—'}</span></td><td>${r.placa ? `<span class="placa">${esc(fmtPlaca(r.placa))}</span>` : '—'}</td>
      <td>${esc(r.tipo)}</td><td class="n">${r.cameras}</td></tr>`).join('') + '</tbody>';

  const novos = S.rows.filter(r => r.novo).length;
  $('#resumo').textContent = `${S.rows.length} veículos · ${novos} novos · ${S.rows.length - novos} já cadastrados (serão atualizados)` + (S.erros.length ? ` · ${S.erros.length} linha(s) com erro ficam de fora` : '');
  validar();
}
function validar(){ $('#btnConfirmar').disabled = !S.rows.length; }

function limpar(){
  S.arquivo = ''; S.base = []; S.regras = {}; S.rows = []; S.erros = [];
  $('#file').value = '';
  $('#secPrev').hidden = true; $('#secArq').hidden = false;
  window.scrollTo({ top:0, behavior:'smooth' });
}

async function confirmar(){
  loading(true);
  try{
    const enviar = S.rows.map(({ setor, prefixo, placa, tipo, cameras }) => ({ setor, prefixo, placa, tipo, cameras, ativo:'SIM' }));
    const setores = [...new Set(enviar.map(r => r.setor))].sort(), nome = S.arquivo;
    const r = await api('importarCadastro', [enviar]);
    limpar();
    $('#msg').innerHTML = `<div class="alert ok"><b>Importação concluída — ${esc(nome)}</b><br>${r.novos} veículo(s) novo(s) e ${r.atualizados} atualizado(s) em ${esc(setores.join(', '))}. Total no cadastro: ${r.total} veículos. O app mostra os veículos em até 1 minuto.</div>`;
  }catch(e){ $('#msg').innerHTML = `<div class="alert err">${esc(e.message || e)}</div>`; window.scrollTo({ top:0, behavior:'smooth' }); }
  finally{ loading(false); }
}

/* ---------- eventos ---------- */
$('#file').addEventListener('change', e => e.target.files[0] && lerArquivo(e.target.files[0]));
const drop = $('#drop');
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => e.dataTransfer.files[0] && lerArquivo(e.dataTransfer.files[0]));
$('#tRegras').addEventListener('click', e => {
  const b = e.target.closest('[data-d]'); if (!b) return;
  const g = S.regras[b.closest('[data-k]').dataset.k];
  g.cameras = Math.max(1, Math.min(8, g.cameras + Number(b.dataset.d))); render();
});
$('#btnCancelar').addEventListener('click', () => { limpar(); $('#msg').innerHTML = ''; });
$('#btnConfirmar').addEventListener('click', confirmar);
</script>
</body>
</html>
